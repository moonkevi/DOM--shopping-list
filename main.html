<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="shopping-container">
        <h1 id="heading">My Shopping List</h1>

        <p class="description">Things I need to buy this week.</p>

        <ul id="shopping-list">
            <li class="info">Bread</li>
            <li class="info">Eggs</li>
            <li class="info">Sugar</li>
            <li class="info">Rice</li>
        </ul>
        <button class="clear" onclick="alert('clear list')"> clear all</button>
        <p id="summary">My weekly shopping</p>
    </main>

    <script src="shopping.js"></script>
</body>
</html>
